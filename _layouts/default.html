<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  {% seo title=false %}
  {% feed_meta %}
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23D52B1E'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>S</text></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="layout">
    {% include sidebar.html %}
    <main id="main" class="content">
      {{ content }}
      <footer class="foot">© {{ site.time | date: "%Y" }} {{ site.data.content.name }}. Built by hand, hosted on GitHub Pages.</footer>
    </main>
  </div>
  <script>
    (function(){
      var root=document.documentElement, btn=document.querySelector('.theme-toggle');
      function current(){ return root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
      btn.addEventListener('click', function(){ var n = current()==='dark' ? 'light' : 'dark'; root.dataset.theme=n; try{localStorage.setItem('theme',n);}catch(e){} });
    })();
  </script>
</body>
</html>
