---
layout: default
nav: updates
---
<article class="wrap article">
  <header class="article-head">
    <p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.tags %}<span class="tags">{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}</span>{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="standfirst">{{ page.summary }}</p>{% endif %}
  </header>
  {% if page.image %}<img class="article-cover" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">{% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/updates/' | relative_url }}">All updates</a></p>
</article>
