---
layout: default
---
<article class="wrap article">
  <header class="article-head">
    {% if page.kicker %}<p class="meta">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="standfirst">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
