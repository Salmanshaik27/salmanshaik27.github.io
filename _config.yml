# Site settings. You rarely need to touch this file.
title: "Salman Shaik"
description: "Research, interactive data and case studies on Swiss companies and markets, by Salman Shaik."
url: "https://salmanshaik.ch"
baseurl: ""
author: "Salman Shaik"
lang: en
permalink: /blog/:title/
markdown: kramdown
collections:
  projects:
    output: true
    permalink: /work/:name/
# Which page design each kind of page uses
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
exclude:
  - HOW-TO-UPDATE.md
  - PROJECT-TEMPLATE.md
