# ---------------------------------------------------------------------
#  3. WHAT I BRING AND WHAT I AM LOOKING FOR
# ---------------------------------------------------------------------
# "What I bring": left empty for now. Add lines like the ones below later.
bring:
  - title: "Strategy and technology in one profile"
    text: "A Bachelor's in Computer Science and Engineering, followed by a **deliberate move into business**. I understand both what a business should change and what it takes to build the tools that make the change stick."
  - title: "Hands-on consulting work"
    text: "In my current projects I **interview stakeholders, assess data quality, map workflows and isolate operational bottlenecks**, and document the results so decision-makers can act on them."
  - title: "Data and structure"
    text: "**Power BI dashboards** from official data, structured problem solving, and as a **certified Scrum Master**, clear work packages and visible milestones."
  - title: "Careful use of AI"
    text: "I use AI to speed up research and structure data, and **I check every output**, because accuracy matters more than speed when a client relies on the result."
  - title: "Thinking past the launch"
    text: "Coming from computer science, I analyse edge cases on purpose. **Even after a solution is implemented, I monitor how it performs** and map alternative scenarios to keep it stable."

motive: "Many firms advise on strategy, and many implement technology. Far fewer take responsibility for **making the two work together**, and that gap is where most transformations succeed or fail."

why: "In a change management project with a Swiss public institution, new digital tools had been introduced without mapping how people actually worked, so staff kept manual fallback steps running alongside the new system. Since then I look at every transformation with one question: **does this change actually remove work, or does it just move it somewhere less visible?** I want to deep dive into a company's issues, find the solution and **guide the company through it**, predicting the next issues and tackling them in order of priority, not just hand over slides."

looking:
  - title: "The role"
    text: "Consulting and strategy roles in Switzerland, **part-time or as an internship**."
  - title: "When"
    text: "**I am available right away**, alongside my studies, ready to work part-time."


