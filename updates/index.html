---
layout: default
title: Updates
---
<section>
  <h2 class="big">Updates.</h2>
  <p class="lead">Short notes on what I am learning and building. Most start as LinkedIn posts.</p>
  <ul class="updates">
    {% for post in site.posts %}
    <li><a href="{{ post.url | relative_url }}"><span class="u-title">{{ post.title }}</span><span class="u-date">{{ post.date | date: "%-d %b %Y" }}</span></a></li>
    {% endfor %}
  </ul>
</section>
