---
layout: frame
title: Blog
---
<article class="article">
  <p class="crumb">(Writing)</p>
  <h1>Blog</h1>
  <p class="lead">Short notes on what I research, build and learn. Most start as LinkedIn posts.</p>
  <ul class="list-posts">
    {% for post in site.posts %}
    <li><a href="{{ post.url | relative_url }}"><span class="d">{{ post.date | date: "%-d %b %Y" }}</span><span><span class="t">{{ post.title }}</span><span class="s">{{ post.summary }}</span></span></a></li>
    {% endfor %}
  </ul>
</article>
